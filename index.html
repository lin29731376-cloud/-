<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e2a44">
<link rel="apple-touch-icon" href="icon-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="독서실">

<title>바른결 관리형 독서실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 바른결 관리형 독서실 — 모눈 공책 위의 공부 시간표 */
  :root {
    --paper: #fafbf7; --grid: #e2e8ee; --ink: #1e2a44; --muted: #66708a; --line: #d5dce6; --panel: #ffffff;
    --study: #2b63d9; --away: #e9a514; --away-ink: #8a5d00; --drowsy: #d64541; --break: #4f8a74; --idle: #8b93a7;
    --bg: var(--paper);
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin: 0; color: var(--ink); line-height: 1.55; min-height: 100vh;
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px; }
  main { max-width: 1080px; margin: 0 auto; padding: 18px 18px 56px; }
  :focus-visible { outline: 3px solid var(--study); outline-offset: 2px; }

  /* 머리 */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 38px; height: 38px; border-radius: 10px; }
  .brand b { display: block; font-size: 18px; letter-spacing: -0.02em; }
  .brand small { display: block; font-size: 12px; color: var(--muted); }
  .me { font-size: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }

  .layout { display: grid; grid-template-columns: minmax(0, 11fr) minmax(0, 9fr); gap: 22px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  /* 책상: 카메라와 오늘 공부 시간 */
  .desk { background: var(--panel); border: 1.5px solid var(--ink); border-radius: 18px; padding: 14px;
    box-shadow: 6px 6px 0 rgba(30, 42, 68, .10); }
  .stage { position: relative; background: #17213a; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .stage[data-s="drowsy"] { outline: 5px solid var(--drowsy); outline-offset: -5px; }
  .stage[data-s="away"] { outline: 5px solid var(--away); outline-offset: -5px; }
  .stage[data-s="drowsy"] video, .stage[data-s="away"] video { opacity: .9; }
  .placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: #c4cbdb;
    text-align: center; padding: 24px; font-size: 15px; }
  .badge { position: absolute; left: 12px; top: 12px; padding: 6px 14px; border-radius: 999px;
    color: #fff; font-weight: 700; font-size: 15px; background: var(--idle); }
  .badge[data-s="study"] { background: var(--study); }
  .badge[data-s="away"] { background: var(--away); color: #2a1d00; }
  .badge[data-s="drowsy"] { background: var(--drowsy); }
  .badge[data-s="break"] { background: var(--break); }
  .facetag { position: absolute; right: 12px; top: 12px; padding: 5px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 600; color: #fff; background: rgba(0,0,0,.5); }
  .facetag[data-ok="1"] { background: rgba(43, 99, 217, .85); }
  .facetag[data-ok="0"] { background: rgba(214, 69, 65, .9); }

  .clock { display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 4px 16px; margin: 16px 4px 4px; }
  .clock span { font-size: 14px; color: var(--muted); grid-column: 1 / -1; }
  #tStudy { font-size: clamp(44px, 9vw, 64px); line-height: 1; font-weight: 700; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; color: var(--ink); }
  .goal { margin-top: 18px; padding: 14px 16px; border: 1.5px solid var(--line, #d9dcd3); border-radius: 14px; background: var(--panel, #fff); }
  .goalHead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .goalHead b { font-size: 16px; color: var(--ink); }
  #goalPct { font-size: 22px; font-weight: 700; color: var(--study); font-variant-numeric: tabular-nums; }
  .goal .meter { height: 14px; margin: 0 0 8px; background: #e8edf5; border-radius: 7px; overflow: hidden; }
  #goalBar { display: block; height: 100%; background: var(--study); border-radius: 7px; }
  #goalMsg { margin: 0; font-size: 14px; }

  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; padding: 11px 18px; border-radius: 12px; border: 1.5px solid var(--ink);
    background: var(--ink); color: #fff; cursor: pointer; }
  button.ghost { background: var(--panel); color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  #start { flex: 1; min-width: 150px; font-size: 17px; padding: 14px 18px; }
  #start:disabled { opacity: 1; background: #e7eefc; color: var(--study); border-color: #c9d8f7; }
  .brk button { flex: 1; min-width: 120px; }
  #brkEnd { background: var(--break); border-color: var(--break); }
  .msg { font-size: 14px; color: var(--muted); }
  .msg.err { color: var(--drowsy); }

  /* 오른쪽: 공책 칸 */
  .side > * + * { margin-top: 18px; }
  .sheet { background: rgba(255,255,255,.88); border-left: 4px solid var(--ink); border-radius: 0 12px 12px 0; padding: 14px 16px; }
  .sheet h2, .sheet summary { font-size: 16px; margin: 0 0 10px; font-weight: 700; letter-spacing: -0.01em; }
  details.sheet { border-left-color: var(--line); }
  details.sheet summary { margin: 0; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
  details.sheet summary::after { content: "펼치기"; font-size: 13px; color: var(--muted); font-weight: 500; }
  details.sheet[open] summary::after { content: "접기"; }
  details.sheet[open] summary { margin-bottom: 8px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 8px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat.a b { color: var(--away-ink); } .stat.d b { color: var(--drowsy); } .stat.k b { color: var(--break); }

  label { display: block; font-size: 14px; margin-top: 12px; }
  label output { float: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  input[type=range] { width: 100%; margin-top: 4px; accent-color: var(--study); }
  input[type=text], input[type=password] { width: 100%; margin-top: 4px; padding: 10px 12px; border: 1.5px solid var(--line);
    border-radius: 10px; font: inherit; background: #fff; color: var(--ink); }
  .meter { height: 8px; background: var(--line); border-radius: 5px; overflow: hidden; margin-top: 6px; position: relative; }
  .meter i { display: block; height: 100%; width: 0; background: var(--ink); }
  .meter em { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--drowsy); }
  .check { display: flex; align-items: center; gap: 8px; }
  .check input { margin: 0; }
  ol.log { list-style: none; margin: 0; padding: 0; max-height: 210px; overflow: auto; font-size: 14px; }
  ol.log li { padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 12px; }
  ol.log time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  ol.log li.empty { color: var(--muted); border: 0; }
  .note { font-size: 13px; color: var(--muted); margin-top: 22px; max-width: 70ch; }

  .wake { position: fixed; inset: 0; z-index: 20; background: rgba(214, 69, 65, .96); color: #fff;
    display: grid; place-items: center; text-align: center; padding: 24px; }
  .wake[hidden] { display: none; }
  .wake p { font-size: 28px; font-weight: 700; margin: 0 0 20px; }
  .wake button { font-size: 20px; padding: 14px 44px; background: #fff; color: var(--drowsy); border-color: #fff; }
</style>
</head>
<body>
<div id="auth"></div>
<main id="app" hidden>
  <header class="top">
    <div class="brand">
      <img src="icon-192.png" alt="">
      <div><b>바른결 관리형 독서실</b><small>온라인 자습실</small></div>
    </div>
    <span class="me" id="meName"></span>
  </header>

  <div class="layout">
    <section class="desk" aria-label="내 책상">
      <div class="stage" id="stage">
        <video id="video" autoplay playsinline muted></video>
        <div class="placeholder" id="placeholder">「공부 시작」을 누르고 카메라를 허용하면 여기에 내 모습이 보입니다.</div>
        <div class="badge" id="badge" hidden>대기 중</div>
        <div class="facetag" id="faceTag" hidden></div>
      </div>

      <div class="clock">
        <span>오늘 공부한 시간</span>
        <b id="tStudy">00:00</b>
      </div>

      <div class="row">
        <button id="start">공부 시작</button>
        <button id="stop" class="ghost" disabled>끝내기</button>
        <span class="msg" id="msg"></span>
      </div>
      <div class="row brk">
        <button id="brkToilet" class="ghost" disabled>화장실 (<span id="limToilet">10</span>분)</button>
        <button id="brkRest" class="ghost" disabled>식사·휴식 (<span id="limRest">40</span>분)</button>
        <button id="brkEnd" hidden>다시 공부하기</button>
      </div>
      <p class="msg" id="lMsg" style="margin:10px 0 0"></p>

    </section>

    <div class="side">

      <section class="sheet">
        <h2>오늘 기록</h2>
        <div class="stats">
          <div class="stat a"><b id="tAway">00:00</b><span>자리비움</span></div>
          <div class="stat d"><b id="tDrowsy">00:00</b><span>졸음 의심</span></div>
          <div class="stat k"><b id="tBreak">00:00</b><span>휴식</span></div>
        </div>
        <ol class="log" id="log"><li class="empty">공부를 시작하면 여기에 기록이 쌓입니다.</li></ol>
      </section>


      <!-- 감지 기준은 관리자가 정하므로 화면에 보이지 않음 (계산에 필요한 값만 숨겨 둠) -->
      <div hidden>
        <output id="oAway"></output><output id="oDrowsy"></output><output id="oThr"></output>
        <input type="range" id="rAway" min="3" max="300" step="1" value="30">
        <input type="range" id="rDrowsy" min="2" max="60" step="1" value="8">
        <input type="range" id="rThr" min="0.3" max="0.9" step="0.05" value="0.6">
        <div class="meter"><i id="eyeBar"></i><em id="eyeMark"></em></div>
        <input type="checkbox" id="beep" checked>
      </div>

      <details class="sheet">
        <summary>내 계정</summary>
        <p class="msg" style="margin:0" id="meEmail"></p>
        <input type="hidden" id="who"><input type="hidden" id="topic"><input type="hidden" id="room">
        <div class="row">
          <input type="password" id="newPw" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password" aria-label="새 비밀번호" style="flex:1;min-width:0;margin:0">
          <button id="pwSave" class="ghost">비밀번호 변경</button>
        </div>
        <p class="msg" id="pwMsg" style="margin:8px 0 0"></p>
        <div class="row">
          <button id="logout" class="ghost">로그아웃</button>
          <button id="appUpdate" class="ghost" type="button" onclick="smUpdate(this)">앱 업데이트</button>
          <span class="msg" id="nMsg"></span>
        </div>
      </details>
    </div>
  </div>

  <p class="note">고개를 깊이 숙여 책을 읽으면 졸음으로 잘못 표시될 수 있어요. 선생님이 확인한 뒤 안내합니다.</p>

  <div class="goal" aria-label="오늘 목표">
    <div class="goalHead"><b>오늘 목표 <span id="goalH">4시간</span></b><span id="goalPct">0%</span></div>
    <div class="meter"><i id="goalBar"></i></div>
    <p class="msg" id="goalMsg"></p>
  </div>
</main>
<div class="wake" id="wake" hidden><div><p>관리자가 호출했습니다</p><button id="wakeOk">확인</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
<script src="auth.js"></script>
<script type="module">
function clockNow() { // HH:MM:SS
  const d = new Date(), z = (x) => String(x).padStart(2, "0");
  return z(d.getHours()) + ":" + z(d.getMinutes()) + ":" + z(d.getSeconds());
}
// 얼굴 인식 도구(MediaPipe) — 최신 버전부터 시도하고, 안 되면 이전 버전으로 자동 대체
const MP_VERSIONS = ["1.2.3", "0.10.35", "0.10.3"];
const mpUrl = (v) => "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@" + v;
let mpUsed = "";
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const LABEL = { study: "공부 중", away: "자리비움", drowsy: "졸음 의심", idle: "대기 중", break: "휴식 중" };
const $ = (id) => document.getElementById(id);

const video = $("video"), stage = $("stage"), badge = $("badge"), msg = $("msg"), faceTag = $("faceTag");
let landmarker = null, stream = null, timer = null, audio = null;
let goalHours = 4; // 오늘 목표(시간) — 관리자가 정함 (학생별 설정 → 없으면 전체 기본값)
let state = "idle", lastTick = 0, lastFace = 0, closedSince = 0, lastOpen = 0;
let why = ""; // 감지 이유 (예: 앱 나감)
// 분할 화면·팝업 창·다른 앱 조작 감지: 휴대폰에서 이 앱 창이 평소 전체 화면 크기보다 작아지거나,
// 다른 앱을 만지느라 이 앱이 선택되지 않으면 바로 자리비움
const isPhone = matchMedia("(pointer: coarse)").matches;
let splitSince = 0;
const fullSize = {}; // 가로/세로 방향별로 지금까지 본 가장 큰 창 크기 = 전체 화면
function splitNow() {
  let small = false;
  if (isPhone) {
    const w = window.innerWidth, h = window.innerHeight, k = w > h ? "land" : "port";
    const f = fullSize[k] || (fullSize[k] = { w: 0, h: 0 });
    f.w = Math.max(f.w, w); f.h = Math.max(f.h, h);
    // 주소창이 숨었다 나타나는 정도(약 10%)는 봐줌. 그보다 작아지면 분할 화면·팝업 창
    small = w < f.w * 0.97 || h < f.h * 0.9;
  }
  return small; // '앱 선택 안 됨(포커스)'은 폰마다 잘못 잡혀서 쓰지 않음 — 창 크기만 봄
}
const total = { study: 0, away: 0, drowsy: 0, break: 0 };

// --- 설정 슬라이더 ---
const cfg = { away: 30, drowsy: 8, thr: 0.6 };
function bind(range, out, key, fmt) {
  const apply = () => { cfg[key] = Number($(range).value); $(out).textContent = fmt(cfg[key]); syncMark(); };
  $(range).addEventListener("input", apply); apply();
}
function syncMark() { $("eyeMark").style.left = (cfg.thr * 100) + "%"; }
bind("rAway", "oAway", "away", (v) => v + "초");
bind("rDrowsy", "oDrowsy", "drowsy", (v) => v + "초");
bind("rThr", "oThr", "thr", (v) => v.toFixed(2));
const BREAK_LIMIT_MIN = { "화장실": 10, "식사·휴식": 40 };
function applyCfg(o) { // 관리자가 정한 감지 기준·휴식 시간 적용
  if (!o) return;
  for (const [key, label, el] of [["toilet", "화장실", "limToilet"], ["rest", "식사·휴식", "limRest"]]) {
    const v = Number(o[key]);
    if (!Number.isFinite(v) || v <= 0) continue;
    BREAK_LIMIT_MIN[label] = v; $(el).textContent = v;
  }
  for (const [key, id] of [["away", "rAway"], ["drowsy", "rDrowsy"], ["thr", "rThr"]]) {
    const v = Number(o[key]);
    if (!Number.isFinite(v) || v <= 0) continue;
    $(id).value = v; $(id).dispatchEvent(new Event("input"));
  }
}

// --- 표시 ---
const fmt = (ms) => {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  const p = (n) => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(r)}` : `${p(m)}:${p(r)}`;
};
function renderTotals() {
  $("tStudy").textContent = fmt(total.study);
  $("tAway").textContent = fmt(total.away);
  $("tDrowsy").textContent = fmt(total.drowsy);
  $("tBreak").textContent = fmt(total.break);
  renderGoal();
}
// 오늘 기록은 이 기기에 저장해 두어, 앱을 나갔다 들어오거나 새로 열어도 그대로 보이게 함
function logKey() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  const uid = window.smAuth && window.smAuth.profile ? window.smAuth.profile.id : "me";
  return "sm_log_" + uid + "_" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
}
function drawLog(at, text) {
  const log = $("log");
  const empty = log.querySelector(".empty"); if (empty) empty.remove();
  const li = document.createElement("li"), t = document.createElement("time"), s = document.createElement("span");
  t.textContent = at; s.textContent = text; li.append(t, s); log.prepend(li);
}
function addLog(text) {
  const at = clockNow();
  drawLog(at, text);
  try {
    const k = logKey(), arr = JSON.parse(localStorage.getItem(k) || "[]");
    arr.push([at, text]); if (arr.length > 500) arr.splice(0, arr.length - 500);
    localStorage.setItem(k, JSON.stringify(arr));
  } catch (e) { /* 저장 안 돼도 화면에는 보임 */ }
}
function restoreLog() { // 오늘 남긴 기록을 다시 그림 (지난 날짜 기록은 정리)
  try {
    const k = logKey();
    Object.keys(localStorage).forEach((x) => { if (x.indexOf("sm_log_") === 0 && x.slice(-8) !== k.slice(-8)) localStorage.removeItem(x); });
    const arr = JSON.parse(localStorage.getItem(k) || "[]");
    if (!arr.length) return;
    $("log").textContent = "";
    arr.forEach(([at, text]) => drawLog(at, text));
  } catch (e) {}
}
function beep() {
  if (!$("beep").checked || !audio) return;
  try {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880; g.gain.value = 0.15;
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + 0.4);
  } catch (e) { /* 알림음 실패는 무시 */ }
}
function setState(next) {
  if (next === state) return;
  const prev = state; state = next;
  badge.textContent = LABEL[next] + (why && (next === "away" || next === "drowsy") ? " · " + why : ""); badge.dataset.s = next; stage.dataset.s = next;
  if (next === "idle") return;
  saveEvent(next);
  if (next === "study") addLog(prev === "idle" ? "공부 시작" : `복귀 (${LABEL[prev]} 해제)`);
  else if (next === "break") addLog(`휴식 시작 (${breakReason})`);
  else { const w = why ? ` (${why})` : ""; addLog(`${LABEL[next]} 감지${w}`); beep(); notify(`${LABEL[next]} 감지${w}`, true); }
}

// --- 관리자 알림 (ntfy.sh 로 전송) ---
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 저장 안 돼도 동작 */ } },
};
function nSay(text, err) { $("nMsg").textContent = text; $("nMsg").classList.toggle("err", !!err); }
async function notify(what, urgent) {
  const topic = $("topic").value.trim().replace(/[^A-Za-z0-9_-]/g, "");
  if (!topic) return false;
  const who = $("who").value.trim() || "이름 미입력";
  const at = clockNow();
  try {
    const r = await fetch("https://ntfy.sh/", {
      method: "POST", keepalive: true,
      body: JSON.stringify({ topic, title: `${who} — ${what}`, message: `${at} 독서실 모니터`,
                             priority: urgent ? 4 : 3, tags: [urgent ? "warning" : "bell"] }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    nSay(`알림 보냄 (${at})`); return true;
  } catch (e) {
    nSay("알림 전송 실패: " + (e && e.message ? e.message : e), true); return false;
  }
}

// --- 관리자 화면 실시간 연결 (영상 서버 LiveKit: 승인된 회원만 입장권을 받음) ---
let linkTimer = null, lk = null, lkRetry = null, linkGen = 0; // lk: { room, pub }
const lSay = (t) => { $("lMsg").textContent = t; };
function sendMsg(obj) { // 관리자에게만 전달
  if (!lk || lk.room.state !== "connected") return;
  const to = [...lk.room.remoteParticipants.values()].map((p) => p.identity).filter((id) => id.startsWith("admin-"));
  if (!to.length) return;
  lk.room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify(obj)),
    { reliable: true, destinationIdentities: to }).catch(() => {});
}
// --- 화면 기록: 공부하는 동안 2초마다 이 폰에 저장 → 관리자 앱이 연결되면 보내 줌 (관리자가 안 보고 있어도 남음) ---
const REC_W = 256, REC_KEEP_MS = 2 * 86400000;
const REC_COLOR = { away: "#e9a514", drowsy: "#d64541", break: "#4f8a74" };
let recDbP = null, recTimer = null, lastShot = 0;
const recSubs = new Set(); // 지금 실시간으로 받는 관리자
function rdb() {
  return recDbP || (recDbP = new Promise((res, rej) => {
    const rq = indexedDB.open("sm_rec_out", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("frames", { keyPath: ["u", "t"] });
    rq.onsuccess = () => res(rq.result); rq.onerror = () => { recDbP = null; rej(rq.error); };
  }));
}
const myUid = () => (window.smAuth && window.smAuth.profile ? window.smAuth.profile.id : "");
function rput(row) {
  return rdb().then((db) => new Promise((res) => { const tx = db.transaction("frames", "readwrite"); tx.objectStore("frames").put(row); tx.oncomplete = res; tx.onerror = res; }));
}
function rafter(since, max) { // since 이후 장면 (시간순, 최대 max장)
  const u = myUid();
  return rdb().then((db) => new Promise((res) => {
    const out = [], rq = db.transaction("frames").objectStore("frames").openCursor(IDBKeyRange.bound([u, since], [u, Infinity], true, false));
    rq.onsuccess = () => { const c = rq.result; if (!c || out.length >= max) { res(out); return; } out.push(c.value); c.continue(); };
    rq.onerror = () => res(out);
  }));
}
function rprune() { // 이틀 지난 장면은 지움
  rdb().then((db) => { db.transaction("frames", "readwrite").objectStore("frames").delete(IDBKeyRange.bound([myUid(), 0], [myUid(), Date.now() - REC_KEEP_MS])); }).catch(() => {});
}
const recCv = document.createElement("canvas"), recCtx = recCv.getContext("2d");
function toJpeg(q) { return new Promise((res) => recCv.toBlob(res, "image/jpeg", q)); }
function stampFrame(st, label, t, phone, mins) {
  const W = recCv.width, H = recCv.height, col = REC_COLOR[st] || "#e9a514", z = (x) => String(x).padStart(2, "0");
  const d = new Date(t), hh = z(d.getHours()) + ":" + z(d.getMinutes()) + ":" + z(d.getSeconds());
  recCtx.lineWidth = 7; recCtx.strokeStyle = col; recCtx.strokeRect(3, 3, W - 6, H - 6);
  recCtx.fillStyle = col; recCtx.fillRect(0, 0, W, 26);
  recCtx.fillStyle = "#fff"; recCtx.textBaseline = "middle"; recCtx.textAlign = "left"; recCtx.font = "bold 14px sans-serif";
  recCtx.fillText(label + "  " + hh, 8, 14);
  if (phone) {
    recCtx.textAlign = "center"; recCtx.font = "bold 18px sans-serif"; recCtx.fillText("📱 앱 나감 · 폰 사용 의심", W / 2, H / 2);
    recCtx.font = "13px sans-serif"; recCtx.fillText("나간 지 " + mins + " (카메라 꺼짐)", W / 2, H / 2 + 24); recCtx.textAlign = "left";
  }
}
async function saveShot(t, st, phone, mins) {
  let b = await toJpeg(0.5);
  if (b && b.size > 14000) b = await toJpeg(0.3); // 한 번에 보낼 수 있는 크기로
  if (!b) return;
  const row = { u: myUid(), t, s: st, b };
  await rput(row);
  recSubs.forEach((id) => sendShot(id, row)); // 실시간으로 받는 관리자에게 바로 보냄
}
async function recShot() {
  if (!timer || !window.smAuth || document.visibilityState !== "visible" || !video.videoWidth) return;
  const now = Date.now(); if (now - lastShot < 1800) return; lastShot = now;
  recCv.width = REC_W; recCv.height = Math.round(REC_W * video.videoHeight / video.videoWidth);
  try { recCtx.drawImage(video, 0, 0, recCv.width, recCv.height); } catch (e) { return; }
  const st = onBreak ? "break" : state;
  if (st !== "study" && st !== "idle") stampFrame(st, badge.textContent, now, false);
  saveShot(now, st, false).catch(() => {});
}
async function fillLeftApp(from, to) { // 앱을 나가 있던 동안은 카메라가 꺼지므로 '폰 사용 의심' 화면으로 채움
  const step = to - from > 3600000 ? 10000 : 2000;
  recCv.width = REC_W; recCv.height = Math.round(REC_W * 3 / 4);
  for (let t = from + step; t < to; t += step) {
    recCtx.fillStyle = "#1e2a44"; recCtx.fillRect(0, 0, recCv.width, recCv.height);
    const sec = Math.floor((t - from) / 1000);
    stampFrame("away", "자리비움", t, true, Math.floor(sec / 60) + "분 " + (sec % 60) + "초");
    try { await saveShot(t, "away", true); } catch (e) { break; }
  }
}
function packShot(row) {
  const head = new TextEncoder().encode(JSON.stringify({ t: row.t, s: row.s }));
  return row.b.arrayBuffer().then((buf) => {
    const out = new Uint8Array(2 + head.length + buf.byteLength);
    out[0] = head.length >> 8; out[1] = head.length & 255; out.set(head, 2); out.set(new Uint8Array(buf), 2 + head.length);
    return out;
  });
}
function sendShot(adminId, row) {
  if (!lk || lk.room.state !== "connected") return Promise.resolve();
  return packShot(row).then((data) => lk.room.localParticipant.publishData(data, { reliable: true, destinationIdentities: [adminId], topic: "rec" })).catch(() => {});
}
async function syncTo(adminId, since) { // 관리자가 아직 못 받은 장면을 차례로 보냄, 다 보내면 실시간으로 전환
  recSubs.delete(adminId);
  let from = Number(since) || 0;
  for (;;) {
    if (!lk || lk.room.state !== "connected") return;
    const rows = await rafter(from, 200);
    if (!rows.length) break;
    for (const r of rows) { await sendShot(adminId, r); from = r.t; }
  }
  recSubs.add(adminId);
}
function sendStatus() {
  sendMsg({ name: $("who").value.trim() || "이름 미입력", state, total, reason: onBreak ? breakReason : (state === "away" || state === "drowsy") ? why : "" });
}
async function sendVideo() {
  if (!lk || lk.room.state !== "connected" || !stream) return;
  const src = stream.getVideoTracks()[0];
  if (!src) return;
  try { if (lk.pub && lk.pub.track) await lk.room.localParticipant.unpublishTrack(lk.pub.track); } catch (e) {}
  // 복제본을 보내므로 영상 서버 쪽에서 트랙을 멈춰도 감지용 카메라는 영향이 없음
  try { lk.pub = await lk.room.localParticipant.publishTrack(src.clone(), { simulcast: false }); }
  catch (e) { lSay("영상 전송 실패: " + (e && e.message ? e.message : e)); }
}
async function connectLink(gen) {
  const retry = (text, ms) => {
    lSay(text);
    lkRetry = setTimeout(() => { if (timer && gen === linkGen) connectLink(gen); }, ms);
  };
  if (!window.LivekitClient || !window.sb) { lSay("영상 연결 모듈을 불러오지 못했습니다. 새로고침하세요."); return; }
  let info = null;
  try {
    const r = await window.sb.functions.invoke("livekit-token", { body: { as: "student" } });
    if (!r.error && r.data && r.data.token && r.data.url) info = r.data;
  } catch (e) { /* 아래에서 재시도 */ }
  if (gen !== linkGen) return;
  if (!info) { retry("영상 서버 입장권을 받지 못했습니다. 10초 후 다시 시도합니다.", 10000); return; }

  const { Room, RoomEvent, DisconnectReason } = window.LivekitClient;
  const room = new Room();
  const me = { room, pub: null };
  room.on(RoomEvent.DataReceived, (payload, from) => { // 관리자가 보낸 명령만 받음
    if (!from || !from.identity.startsWith("admin-")) return;
    try { const d = JSON.parse(new TextDecoder().decode(payload)); if (d && d.cmd === "wake") wakeUp(); else if (d && d.cmd === "cfg") applyCfg(d); else if (d && d.cmd === "goal") setGoal(d.hours); else if (d && d.cmd === "pull") syncTo(from.identity, d.since); } catch (e) {}
  });
  room.on(RoomEvent.ParticipantConnected, () => sendStatus());
  room.on(RoomEvent.ParticipantDisconnected, (p) => { if (p) recSubs.delete(p.identity); });
  room.on(RoomEvent.Disconnected, (reason) => {
    if (lk !== me) return;
    lk = null;
    if (DisconnectReason && reason === DisconnectReason.DUPLICATE_IDENTITY) {
      lSay("같은 계정이 다른 기기에서 접속해 이 기기의 연결이 끊겼습니다."); return;
    }
    retry("영상 서버와 연결이 끊겼습니다. 다시 연결 중…", 5000);
  });
  try { await room.connect(info.url, info.token); }
  catch (e) { retry("영상 서버 연결 실패. 10초 후 다시 시도합니다.", 10000); return; }
  if (gen !== linkGen) { room.disconnect(); return; }
  lk = me; lSay("관리자 화면에 연결됨");
  await sendVideo(); sendStatus();
}
function startLink() {
  lSay("관리자 화면 연결 중…");
  const gen = ++linkGen;
  linkTimer = setInterval(sendStatus, 2000);
  connectLink(gen);
}
function stopLink() {
  linkGen++; clearInterval(linkTimer); linkTimer = null; clearTimeout(lkRetry);
  try { if (lk) lk.room.disconnect(); } catch (e) {}
  lk = null;
}

// --- 휴식 (화장실·식사) ---
let onBreak = false, breakReason = "", breakLeft = false, goneSince = 0, breakStart = 0;
// 휴식 종류별 제한 시간(분) — BREAK_LIMIT_MIN은 맨 위에 선언 (관리자 설정으로 바뀜)
function breakButtons() {
  const running = !!timer;
  $("brkToilet").hidden = $("brkRest").hidden = onBreak;
  $("brkToilet").disabled = $("brkRest").disabled = !running;
  $("brkEnd").hidden = !onBreak;
}
function startBreak(reason) {
  if (!timer) return;
  onBreak = true; breakReason = reason; breakLeft = false; goneSince = 0; breakStart = Date.now();
  breakButtons(); setState("break"); sendStatus();
}
function endBreak() {
  if (!onBreak) return;
  onBreak = false; lastFace = Date.now(); closedSince = 0;
  breakButtons();
}
$("brkToilet").addEventListener("click", () => startBreak("화장실"));
$("brkRest").addEventListener("click", () => startBreak("식사·휴식"));
$("brkEnd").addEventListener("click", endBreak);

// --- 관리자 호출 (깨우기) ---
let wakeTimer = null;
function wakeUp() {
  if (!timer) return;
  addLog("관리자 호출");
  $("wake").hidden = false;
  clearInterval(wakeTimer);
  const ring = () => {
    if (!audio) return;
    try {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "square"; o.frequency.value = 1000; g.gain.value = 0.3;
      o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.35);
    } catch (e) { /* 소리 실패해도 화면 표시는 유지 */ }
  };
  ring(); wakeTimer = setInterval(ring, 700);
}
function wakeDone(ack) {
  clearInterval(wakeTimer); wakeTimer = null; $("wake").hidden = true;
  if (ack) { addLog("관리자 호출 확인"); sendMsg({ ack: "wake" }); }
}
$("wakeOk").addEventListener("click", () => wakeDone(true));

// --- 로그인 계정 · 서버 저장 (Supabase) ---
const dayKey = (() => { const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; })();
let lastSaved = "";
function saveTotals() { // 오늘 누적 시간을 서버에 저장 (30초마다, 중지할 때)

  window.sb.from("study_days").upsert(row, { onConflict: "user_id,day" })
    .then(({ error }) => { if (error) { lastSaved = ""; console.warn("저장 실패", error); } }, () => { lastSaved = ""; });
}
function saveEvent(kind) { // 상태 변화 기록
  if (!window.smAuth) return;
  window.sb.from("study_events").insert({ kind })
    .then(({ error }) => { if (error) console.warn("기록 실패", error); }, () => {});

  $("meName").textContent = $("who").value; $("meEmail").textContent = "아이디 " + window.smIdOf(profile.email);

  $("pwSave").addEventListener("click", async () => { // 내 비밀번호 변경

      .eq("user_id", profile.id).eq("day", dayKey).maybeSingle();

// --- 오늘 목표 ---
function setGoal(h) { if (Number(h) > 0) { goalHours = Number(h); renderGoal(); } }
function renderGoal() {
  const goalMs = goalHours * 3600000, pct = Math.min(100, Math.round(total.study / goalMs * 100));
  $("goalH").textContent = goalHours + "시간";
  $("goalPct").textContent = pct + "%";
  $("goalBar").style.width = pct + "%";

    : `${fmt(total.study)} 채움 · 남은 시간 ${fmt(goalMs - total.study)}`;
}
renderGoal();

// --- 감지 루프 ---
function tick() {
  if (!landmarker) return;
  if (video.readyState < 2 || video.paused) { recover(); return; } // 영상이 멈췄으면 복구 시도
  const now = Date.now();
  let res;
  try { res = landmarker.detectForVideo(video, performance.now()); }
  catch (e) { console.error(e); say("[영상 분석 실패] " + (e && e.message ? e.message : e), true); return; }

  if (document.visibilityState === "hidden" && !onBreak) return; // 앱이 내려가 있는 동안은 자리비움 유지 (돌아오면 그 시간을 자리비움으로 기록)
  const dt = now - lastTick; lastTick = now;
  if (dt > 3000) { // 화면 꺼짐·앱 전환 등으로 분석이 끊긴 시간은 자리비움으로 기록
    total[onBreak ? "break" : "away"] += dt; lastFace = now; closedSince = 0;
    if (!onBreak) addLog(`화면 꺼짐·앱 전환 ${Math.round(dt / 1000)}초 — 자리비움으로 기록`);
  } else if (state !== "idle") total[state] += dt;

  const hasFace = !!(res.faceLandmarks && res.faceLandmarks.length);
  const shapes = hasFace && res.faceBlendshapes && res.faceBlendshapes[0];
  let eye = 0;
  if (hasFace) lastFace = now;
  faceTag.textContent = hasFace ? "얼굴 인식됨" : "얼굴 안 잡힘"; faceTag.dataset.ok = hasFace ? "1" : "0";
  if (shapes) {
    const get = (n) => (shapes.categories.find((c) => c.categoryName === n) || { score: 0 }).score;
    eye = Math.min(get("eyeBlinkLeft"), get("eyeBlinkRight")); // 두 눈 모두 감아야 함
    if (eye >= cfg.thr) { if (!closedSince) closedSince = now; }
    else { lastOpen = now; closedSince = 0; }
  } else {
    closedSince = 0;
  }
  $("eyeBar").style.width = Math.round(eye * 100) + "%";

  if (onBreak) { // 휴식 중에는 자리비움·졸음으로 세지 않음. 자리를 떴다가 돌아오면 자동으로 공부 재개
    if (!hasFace) { if (!goneSince) goneSince = now; if (now - goneSince > 5000) breakLeft = true; }
    else { goneSince = 0; if (breakLeft) endBreak(); }
  }
  if (onBreak) {
    const left = (BREAK_LIMIT_MIN[breakReason] || 10) * 60000 - (now - breakStart);
    if (left <= 0) { // 제한 시간을 넘기면 휴식을 끝내고 관리자에게 알림
      addLog(`휴식 시간 초과 (${breakReason})`); notify(`휴식 시간 초과 (${breakReason})`, true);
      endBreak();
    } else {
      lastFace = now; closedSince = 0; setState("break");
      badge.textContent = `휴식 중 · 남은 ${fmt(left)}`;
      renderTotals(); return;
    }
  }

  if (splitNow()) { if (!splitSince) splitSince = now; } else splitSince = 0;
  let next = "study", w = "";
  if (splitSince && now - splitSince >= 3000) { next = "away"; w = "분할 화면·다른 앱 사용"; } // 3초 넘게 창이 작으면
  else if (now - lastFace >= cfg.away * 1000) next = "away";
  else if (closedSince && now - closedSince >= cfg.drowsy * 1000) { next = "drowsy"; w = "눈 감음"; }
  else if (!hasFace && state !== "study") next = state === "idle" ? "study" : state; // 얼굴이 잠깐 안 잡힐 때는 이전 상태 유지
  if (next !== state) why = w;
  setState(next);
  renderTotals();
}

// --- 카메라 연결·복구 ---
let wakeLock = null, recovering = false;
async function openCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" }, audio: false });
  stream.getVideoTracks()[0].addEventListener("ended", () => recover());
  video.srcObject = stream; await video.play();
  sendVideo(); // 카메라가 다시 연결되면 관리자 화면에도 새 영상 전송
}
async function recover() { // 화면이 꺼졌다 켜지면 카메라가 끊기므로 다시 연결
  if (recovering || !timer || document.visibilityState !== "visible") return;
  recovering = true;
  try {
    const track = stream && stream.getVideoTracks()[0];
    if (!track || track.readyState !== "live") { await openCamera(); addLog("카메라 다시 연결"); }
    else if (video.paused) await video.play();
    say("감지 중");
  } catch (e) {
    say("카메라를 다시 연결하지 못했습니다. 「끝내기」 후 「공부 시작」을 눌러주세요. (" + (e && e.name) + ")", true);
  }
  recovering = false;
}
async function keepAwake() { // 공부 중 화면이 자동으로 꺼지지 않게 함
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); }
  catch (e) { /* 지원하지 않는 기기는 무시 */ }
}
let leftAt = 0;
document.addEventListener("visibilitychange", () => {
  if (!timer) return;
  if (document.visibilityState === "hidden") { // 공부 중 앱을 내리거나 다른 앱을 켜면 바로 기록·알림
    if (onBreak) return;
    leftAt = Date.now(); why = "앱 나감·폰 사용 의심";
    setState("away"); sendStatus();
  } else {
    if (leftAt) {
      addLog(`앱으로 돌아옴 (${Math.round((Date.now() - leftAt) / 1000)}초 나가 있었음)`);
      fillLeftApp(leftAt, Date.now()).catch(() => {}); leftAt = 0;
    }
    keepAwake(); recover();
  }
});

// --- 시작 / 중지 ---
function say(text, err) { msg.textContent = text; msg.classList.toggle("err", !!err); }

$("start").addEventListener("click", async () => {
  $("start").disabled = true; $("start").textContent = "공부 중…";
  let step = "준비";
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  try {
    step = "카메라 연결";
    say("카메라 연결 중…");
    await openCamera();
    $("placeholder").hidden = true;

    if (!landmarker) {
      say("얼굴 인식 모델 내려받는 중… (처음 한 번, 수 초 걸립니다)");
      let lastErr = null;
      for (const v of MP_VERSIONS) {
        try {
          step = "라이브러리 내려받기";
          const mod = await import(mpUrl(v) + "/vision_bundle.mjs");
          const lib = mod.FaceLandmarker ? mod : mod.default;
          const { FaceLandmarker, FilesetResolver } = lib;
          step = "분석 엔진(wasm) 준비";
          const fileset = await FilesetResolver.forVisionTasks(mpUrl(v) + "/wasm");
          step = "모델 불러오기";
          const lm = await FaceLandmarker.createFromOptions(fileset, {
            baseOptions: { modelAssetPath: MODEL, delegate: "CPU" },
            runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: true,
            minFaceDetectionConfidence: 0.3, minFacePresenceConfidence: 0.3, minTrackingConfidence: 0.3,
          });
          // 실제로 한 번 돌려 보고 결과 모양이 맞는지 확인 (안 맞으면 다음 버전)
          const r = lm.detectForVideo(video, performance.now());
          if (!r || !Array.isArray(r.faceLandmarks)) throw new Error("결과 형식이 다름");
          landmarker = lm; mpUsed = v; break;
        } catch (e) { lastErr = e; console.warn("MediaPipe " + v + " 실패", e); }
      }
      if (!landmarker) throw lastErr || new Error("얼굴 인식 도구를 불러오지 못했습니다");
    }
    const now = Date.now();
    lastTick = now; lastFace = now; closedSince = 0; why = ""; splitSince = 0;
    badge.hidden = false; faceTag.hidden = false; faceTag.textContent = "확인 중…"; setState("study");
    timer = setInterval(tick, 200); // 초당 5회면 충분
    clearInterval(recTimer); recTimer = setInterval(recShot, 2000); rprune();
    keepAwake(); startLink(); breakButtons();
    $("stop").disabled = false; say("감지 중");
  } catch (e) {
    console.error(e);
    const hint = { NotAllowedError: "카메라 권한이 차단되어 있습니다. 주소창 왼쪽 아이콘에서 카메라를 허용하세요.",
                   NotFoundError: "연결된 카메라를 찾지 못했습니다.",
                   NotReadableError: "카메라를 다른 프로그램(Zoom, 카카오톡 등)이 쓰고 있습니다. 그 프로그램을 끄고 다시 시도하세요." }[e && e.name];
    say(`[${step} 단계 실패] ` + (hint || "") + ` (${e && e.name ? e.name + ": " : ""}${e && e.message ? e.message : e})`, true);
    stopAll();
  }
});

function stopAll() {
  clearInterval(recTimer); recTimer = null; recSubs.clear();
  clearInterval(timer); timer = null; stopLink(); saveTotals();
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  video.srcObject = null;
  $("placeholder").hidden = false; badge.hidden = true; faceTag.hidden = true;
  if (state !== "idle") addLog("모니터링 종료");
  setState("idle"); delete stage.dataset.s;
  $("eyeBar").style.width = "0";
  onBreak = false; breakButtons(); wakeDone(false);
  $("start").disabled = false; $("start").textContent = "공부 시작"; $("stop").disabled = true;
}
$("stop").addEventListener("click", () => { stopAll(); say("오늘도 수고했어요."); });
</script>
