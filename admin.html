<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>독서실 모니터 — 관리자 화면</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #fffdf8; --ink: #1f2a2e; --muted: #6b7478; --line: #ddd6c8;
    --study: #2f7d5b; --away: #b7791f; --drowsy: #c0392b; --idle: #6b7478;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  input[type=text] { flex: 1 1 200px; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: #fff; color: var(--ink); }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--ink);
    background: var(--ink); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 14px; color: var(--muted); flex-basis: 100%; }
  .msg.err { color: var(--drowsy); }
  .summary { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; margin: 16px 2px 10px; color: var(--muted); }
  .summary b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tile[data-s="away"] { border-color: var(--away); }
  .tile[data-s="drowsy"] { border-color: var(--drowsy); }
  .tile[data-s="lost"], .tile[data-s="off"] { opacity: .65; }
  .stage { position: relative; background: #1f2a2e; aspect-ratio: 4 / 3; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; left: 8px; top: 8px; padding: 4px 12px; border-radius: 999px; color: #fff;
    font-weight: 700; font-size: 13px; background: var(--idle); }
  .tile[data-s="study"] .badge { background: var(--study); }
  .tile[data-s="away"] .badge { background: var(--away); }
  .tile[data-s="drowsy"] .badge { background: var(--drowsy); }
  .meta { padding: 10px 12px; }
  .meta b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 14px; padding: 32px 8px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>관리자 화면</h1>
  <p class="sub">같은 관리 코드를 입력한 학생들의 영상과 상태가 실시간으로 표시됩니다.</p>

  <div class="bar">
    <input type="text" id="topic" placeholder="관리 코드 (영문·숫자·-·_)" maxlength="64" autocomplete="off" autocapitalize="off">
    <button id="go">관리 시작</button>
    <span class="msg" id="msg">관리 코드를 입력하고 「관리 시작」을 누르세요. 이 화면은 켜 둔 채로 두어야 합니다.</span>
  </div>

  <div class="summary" id="summary" hidden>
    <span>접속 <b id="cAll">0</b></span><span>공부 중 <b id="cStudy">0</b></span>
    <span>자리비움 <b id="cAway">0</b></span><span>졸음 의심 <b id="cDrowsy">0</b></span>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>아직 접속한 학생이 없습니다. 학생 화면에서 같은 관리 코드를 입력하고 「카메라 시작」을 누르면 여기에 나타납니다.</p>
</main>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var LABEL = { study: "공부 중", away: "자리비움", drowsy: "졸음 의심", idle: "대기 중", lost: "응답 없음", off: "연결 끊김" };
  var tiles = new Map(); // 학생 연결 ID -> 타일
  var peer = null, audio = null, wakeLock = null;

  try { $("topic").value = localStorage.getItem("sm_topic") || ""; } catch (e) {}
  function say(text, err) { $("msg").textContent = text; $("msg").classList.toggle("err", !!err); }
  function fmt(ms) {
    var s = Math.floor((ms || 0) / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    var p = function (n) { return String(n).padStart(2, "0"); };
    return h ? h + ":" + p(m) + ":" + p(r) : p(m) + ":" + p(r);
  }
  function beep() {
    if (!audio) return;
    try {
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 660; g.gain.value = 0.15; o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.3);
    } catch (e) {}
  }
  function keepAwake() {
    try {
      if ("wakeLock" in navigator && document.visibilityState === "visible")
        navigator.wakeLock.request("screen").then(function (w) { wakeLock = w; }).catch(function () {});
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () { if (peer && document.visibilityState === "visible") keepAwake(); });

  function setTileState(t, s) {
    if (t.state === s) return;
    var prev = t.state; t.state = s;
    t.el.dataset.s = s; t.badge.textContent = LABEL[s] || s;
    if (prev && (s === "away" || s === "drowsy")) beep();
    summarize();
  }
  function summarize() {
    var c = { all: 0, study: 0, away: 0, drowsy: 0 };
    tiles.forEach(function (t) { if (t.state !== "off") c.all++; if (c[t.state] !== undefined) c[t.state]++; });
    $("cAll").textContent = c.all; $("cStudy").textContent = c.study;
    $("cAway").textContent = c.away; $("cDrowsy").textContent = c.drowsy;
    $("empty").hidden = tiles.size > 0;
  }
  function getTile(id) {
    var t = tiles.get(id); if (t) return t;
    var el = document.createElement("article"); el.className = "tile";
    el.innerHTML = '<div class="stage"><video autoplay playsinline muted></video><span class="badge"></span></div>' +
                   '<div class="meta"><b></b><span></span></div>';
    $("grid").append(el);
    t = { el: el, video: el.querySelector("video"), badge: el.querySelector(".badge"),
          name: el.querySelector("b"), times: el.querySelector(".meta span"), last: Date.now(), state: "", who: "" };
    t.name.textContent = "연결 중…";
    tiles.set(id, t); setTileState(t, "idle");
    return t;
  }
  function onData(id, d) {
    if (!d || typeof d !== "object") return;
    var t = getTile(id); t.last = Date.now();
    var who = String(d.name || "이름 미입력").slice(0, 20);
    if (who !== t.who) {
      t.who = who; t.name.textContent = who;
      tiles.forEach(function (o, oid) { // 같은 이름으로 다시 접속하면 끊긴 옛 타일 정리
        if (oid !== id && o.who === who && (o.state === "off" || o.state === "lost")) { o.el.remove(); tiles.delete(oid); }
      });
    }
    var tot = d.total || {};
    t.times.textContent = "공부 " + fmt(tot.study) + " · 자리비움 " + fmt(tot.away) + " · 졸음 " + fmt(tot.drowsy);
    setTileState(t, LABEL[d.state] ? d.state : "idle");
  }

  setInterval(function () { // 학생 쪽 화면이 꺼지거나 페이지를 닫으면 '응답 없음'
    var now = Date.now();
    tiles.forEach(function (t) { if (t.state !== "off" && t.state !== "lost" && now - t.last > 8000) setTileState(t, "lost"); });
  }, 2000);

  $("go").addEventListener("click", function () {
    var topic = $("topic").value.trim().replace(/[^A-Za-z0-9_-]/g, "");
    $("topic").value = topic;
    if (!topic) { say("관리 코드를 입력하세요.", true); return; }
    if (!window.Peer) { say("실시간 연결 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.", true); return; }
    try { localStorage.setItem("sm_topic", topic); } catch (e) {}
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
    $("go").disabled = true; $("topic").disabled = true; say("연결 중…");

    peer = new window.Peer("dsm-" + topic + "-admin");
    peer.on("open", function () {
      say("관리 중 — 학생 접속을 기다립니다. 이 화면을 닫으면 관리가 중단됩니다.");
      $("summary").hidden = false; summarize(); keepAwake();
    });
    peer.on("connection", function (conn) {
      getTile(conn.peer);
      conn.on("data", function (d) { onData(conn.peer, d); });
      conn.on("close", function () { var t = tiles.get(conn.peer); if (t) setTileState(t, "off"); });
    });
    peer.on("call", function (call) {
      call.answer(); // 관리자는 영상을 보내지 않고 받기만 함
      call.on("stream", function (s) {
        var t = getTile(call.peer); t.video.srcObject = s;
        var p = t.video.play(); if (p && p.catch) p.catch(function () {});
      });
    });
    peer.on("disconnected", function () { say("서버 연결이 끊겨 다시 연결하는 중…"); try { peer.reconnect(); } catch (e) {} });
    peer.on("error", function (e) {
      var type = e && e.type ? e.type : String(e);
      if (type === "unavailable-id") {
        say("이 관리 코드로 이미 다른 관리자 화면이 열려 있습니다. 그 화면을 닫고 새로고침하세요.", true);
        $("go").disabled = false; $("topic").disabled = false;
      } else say("연결 오류: " + type, true);
    });
  });
})();
</script>
</body>
</html>
