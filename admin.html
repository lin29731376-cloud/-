<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>독서실 모니터 — 관리자 화면</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #fffdf8; --ink: #1f2a2e; --muted: #6b7478; --line: #ddd6c8;
    --study: #2f7d5b; --away: #b7791f; --drowsy: #c0392b; --idle: #6b7478;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  input[type=text] { flex: 1 1 200px; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: #fff; color: var(--ink); }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--ink);
    background: var(--ink); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 14px; color: var(--muted); flex-basis: 100%; }
  .msg.err { color: var(--drowsy); }
  .summary { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; margin: 16px 2px 10px; color: var(--muted); }
  .summary b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tile[data-s="away"] { border-color: var(--away); }
  .tile[data-s="drowsy"] { border-color: var(--drowsy); }
  .tile[data-s="lost"], .tile[data-s="off"] { opacity: .65; }
  .stage { position: relative; background: #1f2a2e; aspect-ratio: 4 / 3; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; left: 8px; top: 8px; padding: 4px 12px; border-radius: 999px; color: #fff;
    font-weight: 700; font-size: 13px; background: var(--idle); }
  .tile[data-s="study"] .badge { background: var(--study); }
  .tile[data-s="away"] .badge { background: var(--away); }
  .tile[data-s="drowsy"] .badge { background: var(--drowsy); }
  .tile[data-s="break"] .badge { background: #3b6ea5; }
  .meta button + button { margin-left: 6px; }
  .meta { padding: 10px 12px; }
  .meta b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  button.ghost { background: transparent; color: var(--ink); }
  .meta button { margin-top: 8px; padding: 6px 12px; font-size: 13px; background: transparent; color: var(--ink); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 12px; z-index: 10; }
  .modal[hidden] { display: none; }
  .box { background: var(--panel); border-radius: 12px; padding: 14px; width: min(640px, 100%); max-height: 100%; overflow: auto; }
  .phead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  #pImg { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #1f2a2e; border-radius: 8px; display: block; }
  #pTime { font-variant-numeric: tabular-nums; font-weight: 700; margin-top: 8px; }
  #pSeek { width: 100%; accent-color: var(--ink); }
  .prow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .prow .msg { flex-basis: auto; }
  .ptitle { font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .pevents { display: flex; gap: 6px; flex-wrap: wrap; }
  .pevents button { padding: 5px 10px; font-size: 13px; background: transparent; color: var(--ink); border-color: var(--line); }
  .pevents button[data-s="away"] { border-color: var(--away); }
  .pevents button[data-s="drowsy"] { border-color: var(--drowsy); }
  #rText { width: 100%; height: 320px; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
    font: 14px/1.6 inherit; font-family: inherit; background: #fff; color: var(--ink); resize: vertical; }
  input[type=date] { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit;
    background: #fff; color: var(--ink); }
  .mrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0;
    border-bottom: 1px solid var(--line); font-size: 14px; }
  .mrow span { min-width: 0; overflow-wrap: anywhere; }
  .mrow button { padding: 6px 12px; font-size: 13px; flex: none; }
  .empty { color: var(--muted); font-size: 14px; padding: 32px 8px; text-align: center; }
</style>
</head>
<body>
<div id="auth"></div>
<main id="app" hidden>
  <h1>관리자 화면</h1>
  <p class="sub">승인된 학생들의 영상과 상태가 실시간으로 표시됩니다. 화면은 2초마다 한 장씩 이 기기에만 기록되며, 이 페이지를 닫거나 새로고침하면 지워집니다.</p>

  <div class="bar">
    <input type="hidden" id="topic">
    <button id="go">관리 시작</button>
    <button id="logout" class="ghost">로그아웃</button>
    <span class="msg" id="msg">「관리 시작」을 누르세요. 이 화면은 켜 둔 채로 두어야 합니다.</span>
    <span class="msg" id="lkMsg"></span>
  </div>

  <div class="bar" style="margin-top:12px">
    <b style="flex:1">회원 관리</b>
    <button id="mReload" class="ghost">새로고침</button>
    <div id="members" style="flex-basis:100%"></div>
    <span class="msg" id="mMsg"></span>
  </div>

  <div class="bar" style="margin-top:12px">
    <b style="flex:1">기록 조회</b>
    <input type="date" id="hDay" aria-label="조회할 날짜">
    <button id="hLoad" class="ghost">조회</button>
    <div id="hist" style="flex-basis:100%"></div>
    <span class="msg" id="hMsg"></span>
  </div>

  <div class="summary" id="summary" hidden>
    <span>접속 <b id="cAll">0</b></span><span>공부 중 <b id="cStudy">0</b></span>
    <span>자리비움 <b id="cAway">0</b></span><span>졸음 의심 <b id="cDrowsy">0</b></span><span>휴식 <b id="cBreak">0</b></span>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>아직 접속한 학생이 없습니다. 학생이 로그인해서 「카메라 시작」을 누르면 여기에 나타납니다.</p>
</main>

<div class="modal" id="player" hidden>
  <div class="box">
    <div class="phead"><b id="pName"></b><button id="pClose" class="ghost">닫기</button></div>
    <img id="pImg" alt="기록된 화면">
    <div id="pTime">—</div>
    <input type="range" id="pSeek" min="0" max="0" value="0" aria-label="시간 이동">
    <div class="prow">
      <button id="pPlay">재생 (8배속)</button>
      <button id="pLast" class="ghost">최신으로</button>
      <span class="msg" id="pInfo"></span>
    </div>
    <p class="ptitle">알림이 뜬 시각 — 누르면 그 20초 전으로 이동합니다</p>
    <div class="pevents" id="pEvents"></div>
  </div>
</div>

<div class="modal" id="report" hidden>
  <div class="box">
    <div class="phead"><b id="rName"></b><button id="rClose" class="ghost">닫기</button></div>
    <textarea id="rText" readonly aria-label="리포트 내용"></textarea>
    <div class="prow"><button id="rCopy">복사</button><span class="msg" id="rInfo">복사해서 카카오톡이나 문자로 학부모에게 보낼 수 있습니다.</span></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>window.SM_REQUIRE = "admin";</script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var LABEL = { study: "공부 중", away: "자리비움", drowsy: "졸음 의심", idle: "대기 중", lost: "응답 없음", off: "연결 끊김", break: "휴식 중" };
  var tiles = new Map(); // 학생 연결 ID -> 타일
  var running = false, audio = null, wakeLock = null;

  function say(text, err) { $("msg").textContent = text; $("msg").classList.toggle("err", !!err); }
  function fmt(ms) {
    var s = Math.floor((ms || 0) / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    var p = function (n) { return String(n).padStart(2, "0"); };
    return h ? h + ":" + p(m) + ":" + p(r) : p(m) + ":" + p(r);
  }
  function beep() {
    if (!audio) return;
    try {
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 660; g.gain.value = 0.15; o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.3);
    } catch (e) {}
  }
  function keepAwake() {
    try {
      if ("wakeLock" in navigator && document.visibilityState === "visible")
        navigator.wakeLock.request("screen").then(function (w) { wakeLock = w; }).catch(function () {});
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () { if (running && document.visibilityState === "visible") keepAwake(); });

  function setTileState(t, s) {
    if (t.state === s) return;
    var prev = t.state; t.state = s;
    t.el.dataset.s = s; t.badge.textContent = LABEL[s] || s;
    if (prev && (s === "away" || s === "drowsy")) beep();
    if (prev && prev !== "idle" && s !== "idle") { t.events.push({ t: Date.now(), s: s }); if (cur === t) renderEvents(); }
    summarize();
  }
  function summarize() {
    var c = { all: 0, study: 0, away: 0, drowsy: 0, break: 0 };
    tiles.forEach(function (t) { if (t.state !== "off") c.all++; if (c[t.state] !== undefined) c[t.state]++; });
    $("cAll").textContent = c.all; $("cStudy").textContent = c.study;
    $("cAway").textContent = c.away; $("cDrowsy").textContent = c.drowsy; $("cBreak").textContent = c.break;
    $("empty").hidden = tiles.size > 0;
  }
  function getTile(id) {
    var t = tiles.get(id); if (t) return t;
    var el = document.createElement("article"); el.className = "tile";
    el.innerHTML = '<div class="stage"><video autoplay playsinline muted></video><span class="badge"></span></div>' +
                   '<div class="meta"><b></b><span></span><br><button type="button">기록 보기</button><button type="button" class="wakeBtn">깨우기</button><button type="button" class="repBtn">리포트</button></div>';
    $("grid").append(el);
    t = { el: el, video: el.querySelector("video"), badge: el.querySelector(".badge"),
          name: el.querySelector("b"), times: el.querySelector(".meta span"), last: Date.now(), state: "", who: "",
          frames: [], events: [], since: Date.now(), wakes: 0, tot: {} };
    el.querySelector(".repBtn").addEventListener("click", function () { openReport(t); }); // frames: 2초마다 한 장, events: 상태 변화 시각
    el.querySelector(".meta button").addEventListener("click", function () { openPlayer(t); });
    t.wakeBtn = el.querySelector(".wakeBtn");
    t.wakeBtn.addEventListener("click", function () {
      var ok = false;
      try { ok = !!(t.send && t.send({ cmd: "wake" })); } catch (e) {}
      if (ok) t.wakes++;
      wakeLabel(t, ok ? "호출 중…" : "연결 안 됨", ok ? 60000 : 3000);
    });
    t.name.textContent = "연결 중…";
    tiles.set(id, t); setTileState(t, "idle");
    return t;
  }
  function wakeLabel(t, text, ms) {
    t.wakeBtn.textContent = text; clearTimeout(t.wakeTimer);
    t.wakeTimer = setTimeout(function () { t.wakeBtn.textContent = "깨우기"; }, ms);
  }
  function onData(id, d) {
    if (!d || typeof d !== "object") return;
    var t = getTile(id); t.last = Date.now();
    if (d.ack === "wake") { wakeLabel(t, "확인함 ✓", 4000); return; }
    var who = String(d.name || "이름 미입력").slice(0, 20);
    if (who !== t.who) {
      t.who = who; t.name.textContent = who;
      tiles.forEach(function (o, oid) { // 같은 이름으로 다시 접속하면 끊긴 옛 타일 정리
        if (oid !== id && o.who === who && (o.state === "off" || o.state === "lost")) {
          t.frames = o.frames.concat(t.frames); t.events = o.events.concat(t.events); // 기록은 이어받음
          t.since = Math.min(t.since, o.since); t.wakes += o.wakes;
          if (cur === o) cur = t;
          o.el.remove(); tiles.delete(oid);
        }
      });
    }
    var tot = d.total || {}; t.tot = tot;
    t.times.textContent = "공부 " + fmt(tot.study) + " · 자리비움 " + fmt(tot.away) + " · 졸음 " + fmt(tot.drowsy) + " · 휴식 " + fmt(tot.break);
    setTileState(t, LABEL[d.state] ? d.state : "idle");
    if (d.state === "break" && d.reason) t.badge.textContent = "휴식 중 · " + String(d.reason).slice(0, 10);
  }

  setInterval(function () { // 학생 쪽 화면이 꺼지거나 페이지를 닫으면 '응답 없음'
    var now = Date.now();
    tiles.forEach(function (t) { if (t.state !== "off" && t.state !== "lost" && now - t.last > 8000) setTileState(t, "lost"); });
  }, 2000);

  // --- 녹화: 학생별로 2초마다 화면 한 장을 이 브라우저 메모리에 보관 ---
  var MAX_FRAMES = 7200; // 학생당 약 4시간
  var canvas = document.createElement("canvas"), ctx = canvas.getContext("2d");
  setInterval(function () {
    tiles.forEach(function (t) {
      var v = t.video;
      if (!v.videoWidth || t.state === "off" || t.state === "lost") return;
      canvas.width = 320; canvas.height = Math.round(320 * v.videoHeight / v.videoWidth);
      try { ctx.drawImage(v, 0, 0, canvas.width, canvas.height); } catch (e) { return; }
      var at = Date.now();
      canvas.toBlob(function (b) {
        if (!b) return;
        t.frames.push({ t: at, b: b });
        if (t.frames.length > MAX_FRAMES) t.frames.shift();
        if (cur === t) syncSeek();
      }, "image/jpeg", 0.5);
    });
  }, 2000);

  // --- 재생기 ---
  var cur = null, curUrl = null, playTimer = null, pos = 0;
  function clock(ms) { return new Date(ms).toLocaleTimeString("ko-KR", { hour12: false }); }
  function syncSeek() {
    var n = cur ? cur.frames.length : 0;
    $("pSeek").max = Math.max(0, n - 1);
    $("pInfo").textContent = n ? "기록 " + clock(cur.frames[0].t) + " ~ " + clock(cur.frames[n - 1].t)
                               : "아직 기록이 없습니다. 학생 영상이 연결돼야 기록됩니다.";
  }
  function showFrame(i) {
    if (!cur || !cur.frames.length) return;
    pos = Math.min(Math.max(0, i), cur.frames.length - 1);
    var f = cur.frames[pos];
    if (curUrl) URL.revokeObjectURL(curUrl);
    curUrl = URL.createObjectURL(f.b);
    $("pImg").src = curUrl; $("pTime").textContent = clock(f.t); $("pSeek").value = pos;
  }
  function stopPlay() { clearInterval(playTimer); playTimer = null; $("pPlay").textContent = "재생 (8배속)"; }
  function renderEvents() {
    var box = $("pEvents"); box.textContent = "";
    var list = cur.events.filter(function (e) { return e.s === "away" || e.s === "drowsy" || e.s === "lost"; });
    if (!list.length) { box.textContent = "아직 알림이 없습니다."; return; }
    list.forEach(function (e) {
      var b = document.createElement("button"); b.type = "button"; b.dataset.s = e.s;
      b.textContent = clock(e.t) + " " + LABEL[e.s];
      b.addEventListener("click", function () {
        stopPlay();
        var i = 0; while (i < cur.frames.length - 1 && cur.frames[i].t < e.t - 20000) i++;
        showFrame(i);
      });
      box.append(b);
    });
  }
  function openPlayer(t) {
    cur = t; stopPlay();
    $("pName").textContent = (t.who || "학생") + " — 기록 보기";
    $("pImg").removeAttribute("src"); $("pTime").textContent = "—";
    syncSeek(); renderEvents(); showFrame(t.frames.length - 1);
    $("player").hidden = false;
  }
  $("pClose").addEventListener("click", function () { stopPlay(); cur = null; $("player").hidden = true; });
  $("pSeek").addEventListener("input", function () { stopPlay(); showFrame(Number($("pSeek").value)); });
  $("pLast").addEventListener("click", function () { stopPlay(); if (cur) showFrame(cur.frames.length - 1); });
  $("pPlay").addEventListener("click", function () {
    if (playTimer) { stopPlay(); return; }
    if (!cur || !cur.frames.length) return;
    if (pos >= cur.frames.length - 1) showFrame(0);
    $("pPlay").textContent = "일시정지";
    playTimer = setInterval(function () {
      if (!cur || pos >= cur.frames.length - 1) { stopPlay(); return; }
      showFrame(pos + 1);
    }, 250);
  });

  // --- 리포트 ---
  var EVENT_TEXT = { study: "공부 재개", away: "자리비움", drowsy: "졸음 의심", break: "휴식 시작", lost: "응답 없음", off: "연결 끊김" };
  function openReport(t) {
    var n = { away: 0, drowsy: 0, break: 0, lost: 0 };
    t.events.forEach(function (e) { if (n[e.s] !== undefined) n[e.s]++; });
    var tot = t.tot || {}, now = Date.now();
    var lines = [
      "[독서실 리포트] " + (t.who || "학생"),
      new Date(now).toLocaleDateString("ko-KR") + " (" + clock(t.since) + " ~ " + clock(now) + ")",
      "",
      "순공부시간 " + fmt(tot.study),
      "자리비움 " + n.away + "회 · " + fmt(tot.away),
      "졸음 의심 " + n.drowsy + "회 · " + fmt(tot.drowsy),
      "휴식 " + n.break + "회 · " + fmt(tot.break),
      "관리자 호출 " + t.wakes + "회",
    ];
    if (n.lost) lines.push("응답 없음(화면 꺼짐·이탈) " + n.lost + "회");
    lines.push("", "시간대별 기록");
    var ev = t.events.slice(-60);
    if (!ev.length) lines.push("특이사항 없음");
    ev.forEach(function (e) { lines.push(clock(e.t) + " " + (EVENT_TEXT[e.s] || e.s)); });
    $("rName").textContent = (t.who || "학생") + " — 리포트";
    $("rText").value = lines.join("\n");
    $("rInfo").textContent = "복사해서 카카오톡이나 문자로 학부모에게 보낼 수 있습니다.";
    $("report").hidden = false;
  }
  $("rClose").addEventListener("click", function () { $("report").hidden = true; });
  $("rCopy").addEventListener("click", function () {
    var done = function () { $("rInfo").textContent = "복사했습니다."; };
    var manual = function () { $("rText").focus(); $("rText").select(); $("rInfo").textContent = "자동 복사가 막혀 있습니다. 선택된 내용을 직접 복사하세요."; };
    try { navigator.clipboard.writeText($("rText").value).then(done, manual); } catch (e) { manual(); }
  });

  // --- 영상 서버(LiveKit) ---
  var lkRoom = null;
  function lkNote(text) { $("lkMsg").textContent = text; }
  function startLkAdmin() {
    if (lkRoom || !window.LivekitClient || !window.sb) return;
    window.sb.functions.invoke("livekit-token", { body: { as: "admin" } }).then(function (r) {
      if (r.error || !r.data || !r.data.token) {
        lkNote("영상 서버 입장권을 받지 못했습니다. 10초 후 다시 시도합니다."); setTimeout(startLkAdmin, 10000); return;
      }
      var LK = window.LivekitClient, room = new LK.Room();
      var enc = new TextEncoder(), dec = new TextDecoder();
      function bind(p) { // 학생 참가자 → 타일
        if (!p || p.identity.indexOf("stu-") !== 0) return null;
        var t = getTile("lk:" + p.identity);
        t.send = function (o) {
          room.localParticipant.publishData(enc.encode(JSON.stringify(o)), { reliable: true, destinationIdentities: [p.identity] });
          return true;
        };
        return t;
      }
      room.on(LK.RoomEvent.ParticipantConnected, bind);
      room.on(LK.RoomEvent.TrackSubscribed, function (track, pub, p) {
        var t = bind(p); if (t && track.kind === "video") track.attach(t.video);
      });
      room.on(LK.RoomEvent.DataReceived, function (payload, p) {
        if (!bind(p)) return;
        try { onData("lk:" + p.identity, JSON.parse(dec.decode(payload))); } catch (e) {}
      });
      room.on(LK.RoomEvent.ParticipantDisconnected, function (p) {
        var t = tiles.get("lk:" + p.identity); if (t) setTileState(t, "off");
      });
      room.on(LK.RoomEvent.Disconnected, function (reason) {
        if (lkRoom !== room) return;
        lkRoom = null;
        if (LK.DisconnectReason && reason === LK.DisconnectReason.DUPLICATE_IDENTITY) {
          lkNote("다른 곳에서 관리자 화면이 열려 이 화면의 연결이 종료되었습니다. 여기서 계속하려면 새로고침하세요."); return;
        }
        lkNote("영상 서버 연결이 끊겨 다시 연결하는 중…"); setTimeout(startLkAdmin, 5000);
      });
      lkRoom = room;
      room.connect(r.data.url, r.data.token).then(function () {
        lkNote("영상 서버 연결됨"); room.remoteParticipants.forEach(bind);
      }, function (e) {
        lkRoom = null; lkNote("영상 서버 연결 실패: " + (e && e.message ? e.message : e) + " — 10초 후 다시 시도합니다.");
        setTimeout(startLkAdmin, 10000);
      });
    }, function () { lkNote("영상 서버 입장권을 받지 못했습니다. 10초 후 다시 시도합니다."); setTimeout(startLkAdmin, 10000); });
  }

  // --- 로그인 · 회원 관리 ---
  var names = {}; // 회원 id → 이름
  var ROLE_TEXT = { pending: "승인 대기", student: "학생", admin: "관리자" };
  function loadMembers() {
    $("mMsg").textContent = "불러오는 중…";
    window.sb.from("profiles").select("id,email,name,role").order("created_at").then(function (r) {
      var box = $("members"); box.textContent = "";
      if (r.error) { $("mMsg").textContent = "회원 목록을 불러오지 못했습니다: " + r.error.message; return; }
      $("mMsg").textContent = r.data.length ? "" : "아직 가입한 회원이 없습니다.";
      r.data.forEach(function (p) {
        names[p.id] = p.name || p.email || "(이름 없음)";
        var row = document.createElement("div"); row.className = "mrow";
        var who = document.createElement("span");
        who.textContent = (p.name || "(이름 없음)") + " · " + (p.email || "") + " · " + (ROLE_TEXT[p.role] || p.role);
        row.append(who);
        if (p.role !== "admin") {
          var b = document.createElement("button"); b.type = "button";
          var to = p.role === "pending" ? "student" : "pending";
          b.textContent = p.role === "pending" ? "승인" : "이용 정지";
          if (p.role !== "pending") b.className = "ghost";
          b.addEventListener("click", function () {
            b.disabled = true;
            window.sb.rpc("set_role", { target: p.id, new_role: to }).then(function (x) {
              if (x.error) { $("mMsg").textContent = "변경 실패: " + x.error.message; b.disabled = false; return; }
              loadMembers();
            });
          });
          row.append(b);
        }
        box.append(row);
      });
    }, function (e) { $("mMsg").textContent = "회원 목록을 불러오지 못했습니다: " + e; });
  }
  // --- 기록 조회 (서버에 저장된 날짜별 기록) ---
  function loadHistory() {
    var day = $("hDay").value;
    if (!day) return;
    $("hMsg").textContent = "불러오는 중…";
    window.sb.from("study_days").select("user_id,study_ms,away_ms,drowsy_ms,break_ms").eq("day", day)
      .order("study_ms", { ascending: false }).then(function (r) {
        var box = $("hist"); box.textContent = "";
        if (r.error) { $("hMsg").textContent = "기록을 불러오지 못했습니다: " + r.error.message; return; }
        $("hMsg").textContent = r.data.length ? "" : "이 날짜에는 기록이 없습니다.";
        r.data.forEach(function (d) {
          var name = names[d.user_id] || "(알 수 없는 회원)";
          var row = document.createElement("div"); row.className = "mrow";
          var txt = document.createElement("span");
          txt.textContent = name + " · 공부 " + fmt(d.study_ms) + " · 자리비움 " + fmt(d.away_ms) +
                            " · 졸음 " + fmt(d.drowsy_ms) + " · 휴식 " + fmt(d.break_ms);
          var b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.textContent = "상세";
          b.addEventListener("click", function () { loadEvents(d, day, name); });
          row.append(txt, b); box.append(row);
        });
      }, function (e) { $("hMsg").textContent = "기록을 불러오지 못했습니다: " + e; });
  }
  function loadEvents(d, day, name) {
    var from = new Date(day + "T00:00:00"), to = new Date(from.getTime() + 86400000);
    $("hMsg").textContent = "불러오는 중…";
    window.sb.from("study_events").select("kind,at").eq("user_id", d.user_id)
      .gte("at", from.toISOString()).lt("at", to.toISOString()).order("at").limit(500).then(function (r) {
        if (r.error) { $("hMsg").textContent = "상세 기록을 불러오지 못했습니다: " + r.error.message; return; }
        $("hMsg").textContent = "";
        var n = { away: 0, drowsy: 0, break: 0 };
        r.data.forEach(function (e) { if (n[e.kind] !== undefined) n[e.kind]++; });
        var lines = [
          "[독서실 리포트] " + name, day, "",
          "순공부시간 " + fmt(d.study_ms),
          "자리비움 " + n.away + "회 · " + fmt(d.away_ms),
          "졸음 의심 " + n.drowsy + "회 · " + fmt(d.drowsy_ms),
          "휴식 " + n.break + "회 · " + fmt(d.break_ms),
          "", "시간대별 기록",
        ];
        if (!r.data.length) lines.push("특이사항 없음");
        r.data.forEach(function (e) { lines.push(clock(new Date(e.at).getTime()) + " " + (EVENT_TEXT[e.kind] || e.kind)); });
        $("rName").textContent = name + " — " + day + " 기록";
        $("rText").value = lines.join("\n");
        $("rInfo").textContent = "복사해서 카카오톡이나 문자로 학부모에게 보낼 수 있습니다.";
        $("report").hidden = false;
      }, function (e) { $("hMsg").textContent = "상세 기록을 불러오지 못했습니다: " + e; });
  }
  $("hLoad").addEventListener("click", loadHistory);
  $("hDay").addEventListener("change", loadHistory);

  function onReady() {
    $("topic").value = window.smAuth.settings.room_code || "";
    var now = new Date(), p2 = function (x) { return String(x).padStart(2, "0"); };
    $("hDay").value = now.getFullYear() + "-" + p2(now.getMonth() + 1) + "-" + p2(now.getDate());
    loadMembers(); loadHistory();
  }
  $("mReload").addEventListener("click", loadMembers);
  $("logout").addEventListener("click", function () { if (window.smAuth) window.smAuth.logout(); });
  if (window.smAuth) onReady(); else document.addEventListener("sm-ready", onReady, { once: true });

  $("go").addEventListener("click", function () {
    if (!window.LivekitClient || !window.sb) { say("영상 연결 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.", true); return; }
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
    $("go").disabled = true; running = true;
    say("관리 중 — 학생 접속을 기다립니다. 이 화면을 닫으면 관리가 중단됩니다.");
    $("summary").hidden = false; summarize(); keepAwake();
    startLkAdmin();
  });
})();
</script>
</body>
</html>
